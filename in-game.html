<section id="in-game">
    <h1>In Game</h1>
    <p>Check your hand for possible fusions and in-game actions here.</p>
    <div class="row" style="margin-top:2em;">
        <div class="col s12 m7">
            <h4>Board</h4>
            <table id="game-board" style="width:100%;margin-bottom:2em;border-collapse:separate;border-spacing:8px;">
                <tbody>
                    <tr>
                        <td class="board-cell" data-row="0" data-col="0" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="0" data-col="1" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="0" data-col="2" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="0" data-col="3" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="0" data-col="4" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                    </tr>
                    <tr>
                        <td class="board-cell" data-row="1" data-col="0" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="1" data-col="1" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="1" data-col="2" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="1" data-col="3" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                        <td class="board-cell" data-row="1" data-col="4" style="width:70px;height:100px;border:2px dashed #aaa;background:#f5f5f5;text-align:center;"></td>
                    </tr>
                </tbody>
            </table>
            <h4>Your Hand</h4>
            <div id="hand-slots" style="display:flex;gap:12px;justify-content:flex-start;align-items:center;">
                <div class="hand-slot card-slot" data-slot="0"><div class="slot-inner empty"></div></div>
                <div class="hand-slot card-slot" data-slot="1"><div class="slot-inner empty"></div></div>
                <div class="hand-slot card-slot" data-slot="2"><div class="slot-inner empty"></div></div>
                <div class="hand-slot card-slot" data-slot="3"><div class="slot-inner empty"></div></div>
                <div class="hand-slot card-slot" data-slot="4"><div class="slot-inner empty"></div></div>
            </div>
            <button id="place-cards-btn" style="margin-top:12px;padding:8px 16px;background:#1976d2;color:white;border:none;border-radius:4px;cursor:pointer;">Place Cards</button>
            <div id="hand-merges-section" style="margin-top:18px;max-height:220px;overflow-y:auto;"></div>
        </div>
        <div class="col s12 m5">
            <ul class="tabs" id="deck-graveyard-tabs">
                <li class="tab col s6"><a class="active" href="#deck-tab">Your Deck (<span id="deck-count">0</span>)</a></li>
                <li class="tab col s6"><a href="#graveyard-tab">Graveyard (<span id="graveyard-count">0</span>)</a></li>
            </ul>
            <div id="deck-tab" class="tab-content">
                <div class="input-field" style="margin-bottom:0.5em;">
                    <input id="deck-search" type="text" class="validate" autocomplete="off">
                    <label for="deck-search">Search deck...</label>
                    <ul id="deck-search-suggestions" class="collection z-depth-2" style="position:absolute;left:0;right:0;display:none;max-height:220px;overflow-y:auto;z-index: 1002;"></ul>
                </div>
                <ul id="in-game-deck-list" class="collection" style="max-height:320px;overflow-y:auto;"></ul>
            </div>
            <div id="graveyard-tab" class="tab-content" style="display:none;">
                <ul id="graveyard-list" class="collection" style="max-height:320px;overflow-y:auto;"></ul>
            </div>
        </div>
    </div>
</section>
<script src="public/cardTemplates.js"></script>
<script>
$(function() {
    // Load deck from localStorage
    let deck = window.StorageLib ? StorageLib.get('deck', []) : [];
    let hand = [null, null, null, null, null];
    let graveyard = [];
    let cardsCache = null;
    // Helper to render hand
    function renderHand(cards) {
        // Load fusion/equip data if not already loaded
        if (!renderHand.fusionData || !renderHand.equipsData) {
            $.when(
                $.getJSON('public/fusion.json', function(data) { renderHand.fusionData = data; }),
                $.getJSON('public/equips.json', function(data) { renderHand.equipsData = data; })
            ).then(function() { renderHand(cards); });
            return;
        }
        var fusionData = renderHand.fusionData;
        var equipsData = renderHand.equipsData;
        for (let i = 0; i < 5; ++i) {
            const slot = $(`#hand-slots .card-slot[data-slot="${i}"]`);
            let borderColor = '';
            if (hand[i] && cards) {
                const card = cards.find(c => c.Id === hand[i]);
                if (card) {
                    let canFuse = false, canEquip = false;
                    for (let j = 0; j < 5; ++j) {
                        if (i === j || !hand[j]) continue;
                        const otherId = hand[j];
                        if (CardInteractions.canFuse(card.Id, otherId, fusionData)) canFuse = true;
                        if (CardInteractions.canEquip(card.Id, otherId, equipsData)) canEquip = true;
                    }
                    if (canFuse && canEquip) borderColor = '#9c27b0';
                    else if (canFuse) borderColor = '#1976d2';
                    else if (canEquip) borderColor = '#ff9800';
                    slot.html(CardTemplates.handCard(card, borderColor));
                } else {
                    slot.html(CardTemplates.handCard(null));
                }
            } else {
                slot.html(CardTemplates.handCard(null));
            }
            slot.css('border', borderColor ? `3px solid ${borderColor}` : '2px dashed #1976d2');
        }
        // After rendering hand slots, show possible merges
        let mergesHtml = '';
        let foundMerges = CardInteractions.getPossibleMerges(hand, cards, fusionData, equipsData);
        if (foundMerges.length > 0) {
            mergesHtml += '<h5>Possible Merges in Hand</h5>';
            mergesHtml += '<ul class="merge-list-view" style="list-style:none;padding:0;margin:0;">';
            foundMerges.forEach((m, idx) => {
                if (m.type === 'fusion') {
                    const cardA = cards.find(c => c.Id === m.a);
                    const cardB = cards.find(c => c.Id === m.b);
                    const result = cards.find(c => c.Id === m.result);
                    mergesHtml += CardTemplates.mergeFusion(cardA, cardB, result);
                } else if (m.type === 'equip') {
                    const cardA = cards.find(c => c.Id === m.a);
                    const cardB = cards.find(c => c.Id === m.b);
                    mergesHtml += CardTemplates.mergeEquip(cardA, cardB);
                }
            });
            mergesHtml += '</ul>';
        } else {
            mergesHtml += '<div class="grey-text" style="margin-top:10px;">No possible merges in hand.</div>';
        }
        $('#hand-merges-section').html(mergesHtml);
        // Add discard (click to remove) handler for hand slots
        /*$('#hand-slots .card-slot').off('click').on('click', function() {
            const idx = parseInt($(this).attr('data-slot'), 10);
            if (hand[idx]) {
                //hand[idx] = null;
                //graveyard.unshift(hand[idx]); // Add to graveyard (top)
                //renderGraveyard(cards);
                renderHand(cards);
            }
        });*/
    }
    function renderGraveyard(cards) {
        let html = '';
        if (graveyard.length === 0) {
            html = '<li class="collection-item grey-text">Graveyard is empty</li>';
        } else {
            html = graveyard.map(cardId => {
                const card = cards.find(c => c.Id === cardId);
                if (!card) return '';
                return CardTemplates.graveyardCard(card);
            }).join('');
        }
        $('#graveyard-list').html(html);
        $('#graveyard-count').text(graveyard.length);
    }
    // Load all cards
    $.getJSON('public/cards.json', function(cards) {
        cardsCache = cards;
        // Render deck list
        let html = '';
        if (deck.length === 0) {
            html = '<li class="collection-item grey-text">Deck is empty</li>';
        } else {
            const countMap = {};
            deck.forEach(cardId => { countMap[cardId] = (countMap[cardId]||0)+1; });
            let uniqueIds = Object.keys(countMap).map(Number);
            uniqueIds.sort((a,b)=>a-b);
            html = uniqueIds.map(cardId => {
                const card = cards.find(c => c.Id === cardId);
                if (!card) return '';
                return CardTemplates.deckCard(card, countMap[cardId]);
            }).join('');
        }
        $('#in-game-deck-list').html(html);
        $('#deck-count').text(deck.length);
        renderHand(cards);
        renderGraveyard(cards);
        let $suggestBox = $('#deck-search-suggestions');
        let lastSuggestions = [];
        // Helper to get deck cards as objects
        function getDeckCards(cards) {
            const countMap = {};
            deck.forEach(cardId => { countMap[cardId] = (countMap[cardId]||0)+1; });
            let uniqueIds = Object.keys(countMap).map(Number);
            return uniqueIds.map(cardId => {
                const card = cards.find(c => c.Id === cardId);
                return card ? { ...card, count: countMap[cardId] } : null;
            }).filter(Boolean);
        }
        // Deck search suggestions
        $('#deck-search').on('input', function() {
            const val = $(this).val().toLowerCase();
            if (!val) { $suggestBox.hide(); return; }
            const deckCards = getDeckCards(cards);
            lastSuggestions = deckCards.filter(card =>
                card.Name.toLowerCase().includes(val) ||
                card.Id.toString().padStart(3,'0').includes(val)
            ).sort((a, b) => {
                // Prioritize exact number match, then name match, then partials
                if (a.Id.toString().padStart(3,'0') === val) return -1;
                if (b.Id.toString().padStart(3,'0') === val) return 1;
                if (a.Name.toLowerCase() === val) return -1;
                if (b.Name.toLowerCase() === val) return 1;
                // Then by startsWith
                if (a.Name.toLowerCase().startsWith(val) && !b.Name.toLowerCase().startsWith(val)) return -1;
                if (!a.Name.toLowerCase().startsWith(val) && b.Name.toLowerCase().startsWith(val)) return 1;
                // Then by id order
                return a.Id - b.Id;
            }).slice(0, 8);
            if (lastSuggestions.length === 0) { $suggestBox.hide(); return; }
            $suggestBox.html(lastSuggestions.map((card, i) =>
                `<li class="collection-item suggestion-item" data-idx="${i}"><img src="${card.img}" style="height:28px;width:28px;vertical-align:middle;margin-right:8px;">#${card.Id.toString().padStart(3,'0')} - ${card.Name}${card.count > 1 ? ` <span class='badge blue white-text'>x${card.count}</span>` : ''}</li>`
            ).join('')).show();
        });
        // Hide suggestions on blur (with delay for click)
        $('#deck-search').on('blur', function() { setTimeout(() => $suggestBox.hide(), 200); });
        // Helper to add card to hand and remove from deck
        function addToHand(cardId, cards) {
            let slotIdx = hand.findIndex(x => !x);
            if (slotIdx === -1) {
                M.toast && M.toast({html: 'Hand is full!'});
                return;
            }
            // Remove one instance from deck
            const deckIdx = deck.indexOf(cardId);
            if (deckIdx === -1) {
                M.toast && M.toast({html: 'Card not found in deck!'});
                return;
            }
            deck.splice(deckIdx, 1);
            hand[slotIdx] = cardId;
            renderHand(cards);
            // Re-render deck list
            let html = '';
            if (deck.length === 0) {
                html = '<li class="collection-item grey-text">Deck is empty</li>';
            } else {
                const countMap = {};
                deck.forEach(cardId => { countMap[cardId] = (countMap[cardId]||0)+1; });
                let uniqueIds = Object.keys(countMap).map(Number);
                uniqueIds.sort((a,b)=>a-b);
                html = uniqueIds.map(cardId => {
                    const card = cards.find(c => c.Id === cardId);
                    if (!card) return '';
                    let badge = countMap[cardId] > 1 ? `<span class='badge blue white-text'>x${countMap[cardId]}</span>` : '';
                    return `<li class="collection-item"><img src="${card.img}" alt="" style="height:32px;width:32px;object-fit:contain;margin-right:8px;vertical-align:middle;">#${card.Id.toString().padStart(3,'0')} - ${card.Name} ${badge}</li>`;
                }).join('');
            }
            $('#in-game-deck-list').html(html);
            $('#deck-count').text(deck.length);
        }
        // Suggestion click
        $suggestBox.on('click', '.suggestion-item', function() {
            const idx = $(this).data('idx');
            if (lastSuggestions[idx]) {
                addToHand(lastSuggestions[idx].Id, cards);
                $('#deck-search').val("");
                $suggestBox.hide();
            }
        });
        // Deck search logic (Enter key)
        $('#deck-search').on('keydown', function(e) {
            if (e.key === 'Enter') {
                if (lastSuggestions.length > 0) {
                    addToHand(lastSuggestions[0].Id, cards);
                    $(this).val("");
                    $suggestBox.hide();
                } else {
                    M.toast && M.toast({html: 'Card not found in deck!'});
                }
                e.preventDefault();
            }
        });
        // Deck list click
        $('#in-game-deck-list').on('click', '.collection-item', function() {
            const text = $(this).text();
            const match = text.match(/#(\d{3})/);
            if (!match) return;
            const cardId = parseInt(match[1], 10);
            const card = cards.find(c => c.Id === cardId);
            if (!card) return;
            addToHand(card.Id, cards);
        });
    });
    // Tabs logic
    $('#deck-graveyard-tabs').tabs({
        onShow: function(tab) {
            if (tab.id === 'graveyard-tab') {
                renderGraveyard(cardsCache);
            }
        }
    });
    let selectedCards = [];

    // Helper to reset selectedCards
    function resetSelectedCards() {
        selectedCards = [];
        $('.hand-slot').removeClass('selected').find('.merge-number').remove();
    }

    // Add click handler for hand slots
    $('#hand-slots .card-slot').off('click').on('click', function() {
        const idx = parseInt($(this).attr('data-slot'), 10);
        if (hand[idx]) {
            const alreadySelected = selectedCards.findIndex(s => s.slot === idx);
            if (alreadySelected !== -1) {
                // Deselect if already selected
                selectedCards.splice(alreadySelected, 1);
                $(this).removeClass(`selected-${alreadyAlreadySelected + 1}`).find('.merge-number').remove();
                // Update numbers and classes for remaining selections
                selectedCards.forEach((s, i) => {
                    const slotElement = $(`#hand-slots .card-slot[data-slot="${s.slot}"]`);
                    slotElement.removeClass(`selected-${i + 2}`).addClass(`selected-${i + 1}`);
                    slotElement.find('.merge-number').text(i + 1);
                });
            } else {
                // Select card
                selectedCards.push({ slot: idx, cardId: hand[idx] });
                $(this).addClass(`selected-${selectedCards.length}`).append(`<div class='merge-number' style='position:absolute;top:4px;right:4px;background:#1976d2;color:white;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;'>${selectedCards.length}</div>`);
            }
        }
    });

    // Add click handler for board cells
    $('#game-board .board-cell').off('click').on('click', function() {
        const cell = $(this);
        const existingCardImg = cell.find('img');
        const hasBoardCard = existingCardImg.length > 0;
        const selectedCount = selectedCards.length;
        let resultCard = null;

        // 1. No hand card selected
        if (selectedCount === 0) {
            if (!hasBoardCard) {
                M.toast && M.toast({ html: 'No card selected. Please select one or more cards from your hand.' });
            } else {
                // Remove card from board and send to graveyard
                const cardId = parseInt(existingCardImg.attr('data-card-id'), 10);
                if (!isNaN(cardId)) {
                    graveyard.unshift(cardId);
                    renderGraveyard(cardsCache);
                }
                cell.empty();
                M.toast && M.toast({ html: 'Card sent to graveyard.' });
            }
            return;
        }

        // Helper: get result from selected hand cards
        function getHandMergeResult() {
            if (selectedCount === 1) {
                return cardsCache.find(c => c.Id === selectedCards[0].cardId);
            } else {
                // Use CardInteractions.merge for multi-card merge
                const mergeResult = CardInteractions.merge(selectedCards.map(s => s.cardId), cardsCache, renderHand.fusionData, renderHand.equipsData);
                return mergeResult;
            }
        }

        // 2. Hand card(s) selected
        resultCard = getHandMergeResult();
        if (!hasBoardCard) {
            // Empty tile
            if (resultCard) {
                cell.html(CardTemplates.boardCard(resultCard));
                M.toast && M.toast({ html: `Successfully placed ${resultCard.Name} on the board!` });
                // Remove selected cards from hand
                selectedCards.forEach(function(s) { if (s.slot !== null) hand[s.slot] = null; });
                renderHand(cardsCache);
                resetSelectedCards();
            }
        } else {
            // Tile has a card
            const boardCardId = parseInt(existingCardImg.attr('data-card-id'), 10);
            if (isNaN(boardCardId)) return;
            // Try to merge using CardInteractions.merge
            const mergeResult = CardInteractions.merge([boardCardId, resultCard.Id], cardsCache, renderHand.fusionData, renderHand.equipsData);
            if (mergeResult) {
                cell.html(CardTemplates.boardCard(mergeResult));
                M.toast && M.toast({ html: `Merged into ${mergeResult.Name}!` });
            } else {
                cell.html(CardTemplates.boardCard(resultCard));
                M.toast && M.toast({ html: `Board card replaced with ${resultCard.Name}.` });
            }
            // Remove selected cards from hand
            selectedCards.forEach(function(s) { if (s.slot !== null) hand[s.slot] = null; });
            renderHand(cardsCache);
            resetSelectedCards();
        }
    });

    // Add click handler for board tiles
    $('#game-board .board-cell').off('click').on('click', function() {
        const existingCardImg = $(this).find('img');
        if (existingCardImg.length === 0) {
            console.log("selectedCards",selectedCards)
            if (selectedCards.length > 0) {
                const resultCard = selectedCards.reduce((a, b) => attemptMerge([a.Id, b.Id]), selectedCards[0]);
                if (resultCard) {
                    $(this).html(CardTemplates.boardCard(resultCard));
                    M.toast && M.toast({ html: `Successfully placed ${resultCard.Name} on the board!` });
                    // Remove selected cards from hand
                    selectedCards.forEach(function(s) { if (s.slot !== null) hand[s.slot] = null; });
                    renderHand(cardsCache);
                    resetSelectedCards();
                }
            }
        }

        const cardId = parseInt(existingCardImg.attr('data-card-id'), 10);
        if (!isNaN(cardId)) {
            graveyard.unshift(cardId); // Add to graveyard
            renderGraveyard(cardsCache);
        }

        existingCardImg.remove(); // Remove card from board tile
    });

    // Place cards logic
    $('#place-cards-btn').off('click').on('click', function() {
        let resultCard = null;
        if (selectedCards.length < 2) {
            if (selectedCards.length === 1) {
                // If only one card is selected, use it directly
                resultCard = cardsCache.find(c => c.Id === selectedCards[0].cardId);
            }
        }
        // Use CardInteractions.merge for multi-card merge
        if (selectedCards.length >= 2) {
            resultCard = CardInteractions.merge(selectedCards.map(s => s.cardId), cardsCache, renderHand.fusionData, renderHand.equipsData);
        }
        if (resultCard) {
            const nextAvailableCell = $('.board-cell:empty').first();
            if (nextAvailableCell.length) {
                nextAvailableCell.html(CardTemplates.boardCard(resultCard));
                M.toast && M.toast({ html: `Successfully placed ${resultCard.Name} on the board!` });

                // Remove selected cards from hand
                selectedCards.forEach(s => {
                    if (s.slot !== null) hand[s.slot] = null;
                });
                renderHand(cardsCache);
                resetSelectedCards();
            } else {
                M.toast && M.toast({ html: 'No empty cells available on the board!' });
            }
        } else {
            M.toast && M.toast({ html: 'Failed to merge/place cards. Please try again.' });
        }
    });
});
</script>
