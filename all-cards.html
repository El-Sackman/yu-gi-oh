<section id="all-cards">
    <h2>All Cards</h2>
    <div class="row">
        <div class="col s12 m8 l9">
            <div id="all-cards-list" class="row" style="max-height:70vh;overflow-y:auto;"></div>
        </div>
        <div class="col s12 m4 l3">
            <div id="card-detail-panel" class="card sticky-action" style="position:sticky;top:1rem;">
                <div class="card-image">
                    <img id="detail-img" src="https://yugioh-fm-db.pages.dev/assets/images/cards/card/eu/001.webp" alt="Blue-eyes White Dragon" style="height:220px;object-fit:contain;">
                </div>
                <div class="card-content">
                    <span class="card-title" id="detail-title" style="font-size:1.1rem;">#001 - Blue-eyes White Dragon</span>
                    <p id="detail-desc">An extremely rare card with unsurpassed attack and defense power.</p>
                    <ul id="detail-stats" style="font-size:0.95rem;margin-top:1em;"></ul>
                </div>
            </div>
        </div>
    </div>
    <script>
    $(function() {
        function renderDetail(card) {
            $('#detail-img').attr('src', card.desc).attr('alt', card.Name);
            $('#detail-title').text(`#${card.Id.toString().padStart(3, '0')} - ${card.Name}`);
            $('#detail-desc').text(card.Description);
            let stats = `
                <li><b>Attack:</b> ${card.Attack}</li>
                <li><b>Defense:</b> ${card.Defense}</li>
                <li><b>Level:</b> ${card.Level}</li>
                <li><b>Type:</b> ${card.Type}</li>
                <li><b>CardCode:</b> ${card.CardCode}</li>
            `;
            $('#detail-stats').html(stats);
        }
        $.getJSON('public/cards.json', function(cards) {
            var html = '';
            cards.forEach(function(card, idx) {
                html += `
                <div class="col s12 m6 l4 xl3">
                    <div class="card small hoverable card-thumb" data-card-idx="${idx}">
                        <div class="card-image">
                            <img src="${card.img}" alt="${card.Name}" style="height:180px;object-fit:contain;">
                        </div>
                        <div class="card-content">
                            <span class="card-title" style="font-size:1.1rem;">#${card.Id.toString().padStart(3, '0')} - ${card.Name}</span>
                        </div>
                    </div>
                </div>
                `;
            });
            $('#all-cards-list').html(html);
            // Default select first card
            renderDetail(cards[0]);
            // Card click event
            $('.card-thumb').on('click', function() {
                var idx = $(this).data('card-idx');
                renderDetail(cards[idx]);
                $('.card-thumb').removeClass('blue lighten-4');
                $(this).addClass('blue lighten-4');
            });
            // Highlight first card
            $('.card-thumb').first().addClass('blue lighten-4');
        });
    });
    </script>
</section>
